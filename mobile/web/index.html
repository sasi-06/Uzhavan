<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="uzhavan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>uzhavan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error('JS Error:', message, source, lineno, error);
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      var r = event.reason;
      var str = '';
      if (r) {
        str = (r.message || '') + ' ' + (r.stack || '') + ' ' + String(r);
        try { str += ' ' + JSON.stringify(r); } catch(e) {}
      }
      var strLower = str.toLowerCase();
      if (
        strLower.indexOf('permission-denied') !== -1 ||
        strLower.indexOf('speechsynthesis') !== -1 ||
        strLower.indexOf('failed to fetch') !== -1 ||
        strLower.indexOf('firebase') !== -1 ||
        strLower.indexOf('rethrowndarterror') !== -1
      ) {
        event.preventDefault();
        return;
      }
      console.warn('Unhandled Promise Rejection:', event.reason);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
